name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@cargo-audit
      - name: Verify formatting
        run: cargo fmt --check
      - name: Lint all targets
        run: cargo clippy --all-targets -- -D warnings
      - name: Verify behavioural coverage
        run: make test-cov
      - name: Verify deterministic release artifacts
        run: python3 -m unittest scripts/test_release_artifacts.py
      - name: Verify locked release build
        shell: bash
        run: ./scripts/build-release.sh
      - name: Audit locked dependencies
        run: cargo audit --deny warnings
