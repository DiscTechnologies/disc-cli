[package]
name = "disc-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE"
authors = ["Disc Technologies"]

[[bin]]
name = "disc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.39", features = ["derive", "env"] }
comfy-table = "7.2.1"
dialoguer = "0.11.0"
directories = "6.0.0"
fs2 = "0.4.3"
futures-util = "0.3.31"
humantime = "2.3.0"
keyring = "4.1.5"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rmp-serde = "1.3.0"
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
secrecy = "0.10.3"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
urlencoding = "2.1.3"
uuid = { version = "1.18.1", features = ["v4"] }
webbrowser = "1.0.6"

[dev-dependencies]
keyring-core = "1.0.0"
